name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\ScheduleAssistant.sln --nologo

      - name: Release build
        run: dotnet build .\ScheduleAssistant.sln --configuration Release --no-restore --nologo

      - name: Tests
        run: dotnet test .\ScheduleAssistant.sln --configuration Release --no-build --no-restore --nologo --logger trx --results-directory .\TestResults -m:1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
